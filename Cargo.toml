[package]
name = "viz-shell"
description = "One shell for every repor"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jan-blomquist/viz-shell"
authors = ["Jan Blomquist"]

[[bin]]
name = "vz"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
bollard = "0.21"
env_logger = "0.11.11"
futures-util = "0.3.34"
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "1.3.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
