[package]
name = "viz-shell"
description = "One shell for every repo"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jan-blomquist/viz-shell"
authors = ["Jan Blomquist"]

[[bin]]
name = "viz-shell"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
docker-wrapper = { version = "0.11", default-features = false, features = ["tracing"] }
dotenvy = "0.15"
nix = { version = "0.31", default-features = false, features = ["user"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "1.3.0"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["macros", "process", "rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter", "ansi", "std"] }

[dev-dependencies]
tempfile = "3.27.0"
