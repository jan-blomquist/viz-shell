image:
  dockerfile: Dockerfile

state:
  # Crate downloads: the image keeps CARGO_HOME at /usr/local/cargo.
  /usr/local/cargo/registry: dir
  # OpenCode's data folder, and its config file, which must start as valid JSON.
  ~/.local/share/opencode: dir
  ~/.config/opencode/opencode.json: { type: file, init: "{}" }

mounts:
  # All repositories, read-only. This one stays read-write: the repository's
  # own mount is deeper and lands on top.
  ~/repos: ro
