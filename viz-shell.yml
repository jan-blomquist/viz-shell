image:
  dockerfile: Dockerfile

# fish, with its configuration and history kept in this repository's state
# rather than taken from the host.
shell: fish

state:
  - ~/.config/fish
  - ~/.local/share/fish
  # Crate downloads: the image keeps CARGO_HOME at /usr/local/cargo.
  - /usr/local/cargo/registry

share:
  # The host's docker daemon: `vz -- just examples` runs the example tests
  # from inside vz.
  docker: false

env:
  defaults:
    RUST_LOG: info
    CARGO_TERM_COLOR: always
  files:
    # This repository's own, never committed (.gitignore); skipped when missing.
    - .env
