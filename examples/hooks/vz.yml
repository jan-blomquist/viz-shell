# Hooks: commands run inside, as you, in the repository root, through `sh -c`.
# `create` once per container; `attach` before every entry.
image: debian:stable-slim

hooks:
  create:
    - mkdir -p ~/.local/state/hooks
    - echo create >> ~/.local/state/hooks/log
    - echo second >> ~/.local/state/hooks/log     # in order
  attach:
    - echo attach >> ~/.local/state/hooks/log
    - pwd > ~/.local/state/hooks/pwd

profiles:
  # Its output reaches the terminal.
  loud:
    hooks:
      create:
        - echo hello from create

  # Keyed by the command: enabled: false removes one.
  quiet:
    hooks:
      create:
        - { run: echo second >> ~/.local/state/hooks/log, enabled: false }

  # A failing hook fails the entry.
  failing:
    hooks:
      create:
        - exit 3

  # Create once for the container, across a stop and start; attach for each entry.
  kept:
    extends: loud
    persistent: true

  kept-failing:
    extends: failing
    persistent: true
