# Sessions: every container is named vz-<index>-<repository>, its hostname too,
# and labeled with its repository and profile. `vz ls` lists them, `vz attach`
# joins one, `vz new NAME` names one, `vz kill` removes them.
image: debian:stable-slim

profiles:
  # The container outlives the shell that created it; shells attach to it.
  kept:
    persistent: true

  # And a plain `vz` joins it rather than creating another.
  shared:
    persistent: true
    attach: true
