# A global configuration, as this example's test writes it into its throwaway
# home: ~/.config/viz-shell/viz-shell.global.yml. Relative paths are relative to it.
image: debian:stable-slim

env:
  defaults:
    WHO: global
  files:
    - environment           # ~/.config/viz-shell/environment

profiles:
  trusted:
    env:
      files:
        - trusted.env        # secrets only trusted mode sees
