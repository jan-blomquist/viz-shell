# Share the host's docker daemon: its socket at the same path inside, joined
# through its group, so docker works as on the host, without sudo. It gives
# the shell control of the host's daemon: share it only with repositories you
# trust.
image: docker:29-cli

share:
  docker: true

profiles:
  # The same shell, without the daemon.
  offline:
    share:
      docker: false
