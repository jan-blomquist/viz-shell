# Mounts: host paths shown at the same path inside the container. They reuse
# the host's own files; each must exist on the host.
image: debian:stable-slim

mounts:                                 # keyed by host path: ro | rw | true (ro) | false
  # Every repository, read-only, for reading and grepping.
  # The repository vz runs for stays read-write inside it.
  ~/repos: ro
  # The gh CLI's login, shared with the host, read-write.
  ~/.config/gh: rw
  # Your git identity, read-only.
  ~/.gitconfig: ro
