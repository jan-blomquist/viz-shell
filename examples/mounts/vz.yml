# Mounts: host paths shown inside the container, written as docker's -v:
# path[:target][:ro|rw]. Read-write unless `:ro`; at the same path unless a
# target names another. They reuse the host's own files; each must exist on
# the host.
image: debian:stable-slim

state:
  # A tool's folder whose contents survive; a mount lands inside it below.
  - ~/.config/agent

mounts:
  # Every repository, read-only. The repository vz runs for stays read-write
  # inside it.
  - ~/repos:ro
  # One repository read-write for every session, like a shared notes repo:
  # the bare form. When vz runs for that repository itself, the entry is
  # skipped: the repository is mounted there already.
  - ~/repos/app
  # The gh CLI's login, shared with the host, read-write.
  - ~/.config/gh
  # Your git identity: a single file, read-only.
  - ~/.gitconfig:ro
  # One host folder at two other paths, as a library several tools read:
  # one of them inside the state folder above. The map form says the same.
  - ~/library:~/.agents/library:ro
  - { path: ~/library, target: ~/.config/agent/library, mode: ro }
