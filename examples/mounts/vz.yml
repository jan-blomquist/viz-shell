# Mounts: host paths shown at the same path inside the container. They reuse
# the host's own files; each must exist on the host.
image: debian:stable-slim

mounts:
  # Read-only, the default: every repository, for reading and grepping.
  # The repository vz runs for stays read-write inside it.
  - ~/repos
  # Read-write, docker style: the gh CLI's login, shared with the host.
  - ~/.config/gh:rw
  # Your git identity, read-only, spelled out.
  - ~/.gitconfig:ro
