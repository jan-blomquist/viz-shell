# State: container paths whose contents survive the container, kept at their
# own path under the state folder. The host's own files are never touched.
image: debian:stable-slim

# The state folder: by default .vz_state at the git root. This example keeps
# its own, next to this file, so its test starts from a clean slate.
state_dir: .vz_state

state:
  # A folder, the short form: kept at <state_dir>/home/<you>/.local/share/opencode
  - ~/.local/share/opencode
  # A file, created with its init content the first time, never rewritten.
  - { path: ~/.config/opencode/opencode.json, type: file, init: "{}" }
  # Shell history, kept in a folder: point HISTFILE into it.
  - ~/.local/state/bash
  # Caches of language tools.
  - ~/.cache/pip
  - ~/.npm
  # Any absolute path, too: kept at <state_dir>/opt/data
  - /opt/data
