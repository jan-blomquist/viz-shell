# Profiles: named layers on top of the default (the top-level keys), chosen with
# `vz --profile NAME` or VZ_PROFILE=NAME. An entry with the same path updates
# the default's in its place; `enabled: false` removes one.
image: debian:stable-slim
state_dir: .vz_state

# The default: what plain `vz` runs with.
mounts:
  - ~/repos

profiles:
  # The same mount, now read-write.
  writable:
    mounts:
      - ~/repos:rw

  # The mount removed.
  isolated:
    mounts:
      - { path: ~/repos, enabled: false }

  # Everything `isolated` does, plus a scratch folder that survives.
  scratch:
    extends: isolated
    state:
      - ~/scratch
