# Profiles: named layers on top of this file's root, chosen with
# `vz --profile NAME` or VZ_PROFILE=NAME. An entry with the same path updates
# the root's in its place; `enabled: false` removes one.
image: debian:stable-slim
state_dir: .vz_state

# The root: what plain `vz` runs with.
mounts:
  - ~/repos

profiles:
  # The same mount, now read-write.
  writable:
    mounts:
      - ~/repos:rw

  # The mount removed.
  isolated:
    mounts:
      - { path: ~/repos, enabled: false }

  # Everything `isolated` does, plus a scratch folder that survives.
  scratch:
    extends: isolated
    state:
      - ~/scratch
