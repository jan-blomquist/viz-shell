# Your overlay of vz.yml, for this checkout only; later wins. Keep it out of
# git (`*.local.yml` in .gitignore): this one is tracked on purpose, so the
# test sees vz warn about it.
mounts:
  - ~/shared:rw                   # the same path: now writable, for you
  - ~/mine                        # and one only you have

env:
  defaults:
    WHO: local

profiles:
  extra:                          # merges over the repository's `extra`
    env:
      defaults:
        WHO: local-extra
